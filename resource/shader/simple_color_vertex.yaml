        #version 140

        in vec4 Position;
        //in vec3 Color;
        in vec4 Color;

        uniform mat4 MVPMatrix;
        layout(std140) uniform Transform {   // per-draw model matrix, UBO-backed
        mat4 MVMatrix;
        };

        out vec4 DiffuseColor;

        void main() {
                DiffuseColor = Color;//vec4(Color, 1.0);
                gl_Position  = MVPMatrix * (MVMatrix * Position);
        }

