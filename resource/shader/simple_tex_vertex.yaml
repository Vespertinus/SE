type: VERTEX
source:
 - |
        #version 140

        in vec4         Position;
        in vec2         TexCoord0;

        uniform mat4    MVPMatrix;
        layout(std140) uniform Transform {   // per-draw model matrix, UBO-backed
        mat4 MVMatrix;
        };

        out vec2        TexCoord;

        void main() {
                TexCoord        = TexCoord0;
                gl_Position     = MVPMatrix * (MVMatrix * Position);
        }
